name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 언어 채점 테스트는 도구가 없으면 건너뛴다. 여기 적은 언어는 건너뛰지 않고 반드시 돈다.
          - os: ubuntu-latest
            langs: java,cpp,py,kt
          - os: macos-latest
            langs: java,cpp,py
          # Windows에는 python3 명령이 기본으로 없다 (사용자는 run = "python {{file}}"로 덮어씀).
          - os: windows-latest
            langs: java,cpp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          BOJ_REQUIRE_LANGS: ${{ matrix.langs }}
